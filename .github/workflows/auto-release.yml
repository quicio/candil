name: auto-release

on:
  workflow_run:
    workflows: ["build"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar git
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Decidir versión
        id: version
        shell: bash
        run: |
          set -euo pipefail
          out() { printf '%s\n' "$1" >> "$GITHUB_OUTPUT"; }
          head_subject=$(git log -1 --format=%s)
          case "$head_subject" in
            chore\(release\):*)
              out "skip=true"
              exit 0
              ;;
          esac

          last=$(git tag --list 'v*' --sort=-v:refname | head -1)
          if [ -z "$last" ]; then
            out "skip=true"
            exit 0
          fi

          if git diff --quiet "$last"..HEAD -- src Cargo.toml Cargo.lock assets resources; then
            out "skip=true"
            exit 0
          fi

          current=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          current=$(printf '%s' "$current" | tr -cd '0-9.')
          subjects=$(git log --format=%B "$last"..HEAD)

          bump="patch"
          if printf '%s\n' "$subjects" | grep -qE '^feat(\(|:|!)'; then
            bump="minor"
          fi
          if printf '%s\n' "$subjects" | grep -qE '(^feat(\([^)]*\))?!:|BREAKING CHANGE)'; then
            bump="major"
          fi

          IFS=. read -r major minor patch <<< "$current"
          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          next="$major.$minor.$patch"

          out "skip=false"
          out "version=$next"
          out "tag=v$next"
          out "bump=$bump"

      - name: Bump Cargo.toml y Cargo.lock
        if: steps.version.outputs.skip != 'true'
        env:
          NEXT: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          sed -i "s/^version = \".*\"/version = \"$NEXT\"/" Cargo.toml
          sed -i "/^name = \"candil\"$/{n;s/^version = \".*\"/version = \"$NEXT\"/;}" Cargo.lock
          grep -q "^version = \"$NEXT\"$" Cargo.toml
          grep -A1 '^name = "candil"$' Cargo.lock | grep -q "^version = \"$NEXT\"$"

      - name: Commit, tag y push
        if: steps.version.outputs.skip != 'true'
        env:
          NEXT: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git add Cargo.toml Cargo.lock
          git commit -m "chore(release): v$NEXT"
          git tag -a "$TAG" -m "Candil $NEXT"
          git push origin main
          git push origin "$TAG"

      - name: Disparar el release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: gh workflow run release.yml --ref main -f tag="$TAG"

      - name: Resumen
        shell: bash
        env:
          SKIP: ${{ steps.version.outputs.skip }}
          NEXT: ${{ steps.version.outputs.version }}
          BUMP: ${{ steps.version.outputs.bump }}
        run: |
          if [ "$SKIP" = "true" ]; then
            echo "Sin cambios de código desde el último tag; no se publica." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Publicando **v$NEXT** (bump: $BUMP)." >> "$GITHUB_STEP_SUMMARY"
          fi
