name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            artifact: candil-linux
          - name: macos
            os: macos-latest
            artifact: candil-macos
          - name: windows
            os: windows-latest
            artifact: candil-windows

    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de Linux (X11/Wayland/GL)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Rust estable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de Cargo
        uses: Swatinem/rust-cache@v2

      - name: Tests (sin red; el live está ignorado)
        run: cargo test

      - name: Build dist
        run: cargo build --profile dist

      - name: Preparar artefacto
        shell: bash
        run: |
          mkdir -p out
          if [ -f target/dist/candil.exe ]; then
            cp target/dist/candil.exe out/
          else
            cp target/dist/candil out/
          fi

      - name: Subir binario
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/
          if-no-files-found: error
