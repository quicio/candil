name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a publicar (vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: candil-linux-x86_64
            os: ubuntu-latest
          - name: candil-macos-arm64
            os: macos-latest
          - name: candil-windows-x86_64
            os: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Verificar versión del tag
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$RELEASE_TAG" ]; then
            echo "El tag $RELEASE_TAG no coincide con Cargo.toml ($version)" >&2
            exit 1
          fi

      - name: Dependencias de Linux (X11/Wayland/GL)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Rust estable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de Cargo
        uses: Swatinem/rust-cache@v2

      - name: Tests (sin red; el live está ignorado)
        run: cargo test

      - name: Build dist
        run: cargo build --profile dist

      - name: Empaquetar Linux (.deb, .rpm, .pkg.tar.zst, tarball)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y desktop-file-utils appstream
          curl -fsSL -o /tmp/nfpm.tar.gz \
            https://github.com/goreleaser/nfpm/releases/download/v2.49.0/nfpm_2.49.0_Linux_x86_64.tar.gz
          sudo tar -C /usr/local/bin -xzf /tmp/nfpm.tar.gz nfpm
          bash packaging/build.sh out

      - name: Preparar artefacto
        shell: bash
        run: |
          mkdir -p out
          if [ -f target/dist/candil.exe ]; then
            cp target/dist/candil.exe out/
          else
            cp target/dist/candil out/
          fi

      - name: Empaquetar Candil.app (macOS arm64)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          scripts/make_app.sh target/dist/candil out/Candil.app
          ditto -c -k --sequesterRsrc --keepParent out/Candil.app out/candil-macos-arm64-app.zip
          COPYFILE_DISABLE=1 tar -C out -czf out/candil-macos-arm64-app.tar.gz Candil.app

      - name: Build y empaquetar macOS Intel (x86_64)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          rustup target add x86_64-apple-darwin
          cargo build --profile dist --target x86_64-apple-darwin
          cp target/x86_64-apple-darwin/dist/candil out/candil-macos-x86_64
          scripts/make_app.sh target/x86_64-apple-darwin/dist/candil out/Candil.app
          ditto -c -k --sequesterRsrc --keepParent out/Candil.app out/candil-macos-x86_64-app.zip
          COPYFILE_DISABLE=1 tar -C out -czf out/candil-macos-x86_64-app.tar.gz Candil.app

      - name: Subir binario
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/
          if-no-files-found: error

  publish:
    name: Publicar release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Descargar binarios
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Renombrar y checksums
        shell: bash
        run: |
          mkdir -p dist
          for dir in artifacts/*; do
            name=$(basename "$dir")
            for file in "$dir"/*; do
              [ -f "$file" ] || continue
              base=$(basename "$file")
              case "$base" in
                candil) cp "$file" "dist/$name" ;;
                candil.exe) cp "$file" "dist/$name.exe" ;;
                *) cp "$file" "dist/" ;;
              esac
            done
          done
          chmod +x dist/candil-* 2>/dev/null || true
          cd dist
          sha256sum -- * > SHA256SUMS.txt

      - name: Borrar release existente (re-tags)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "$RELEASE_TAG" --yes --cleanup-tag=false || true

      - name: Crear release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
