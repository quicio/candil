[package]
name = "candil"
version = "0.20.0"
edition = "2021"
description = "Lector de EPUB minimalista en Rust"
license = "MIT"
repository = "https://github.com/quicio/candil"
readme = "README.md"

[dependencies]
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
zip = "9"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
dirs = "6"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
keyring = "4.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
rfd = "0.15"

# Iteración diaria: optimizado como release, sin LTO ni debug info.
# Sin incremental: recompila el crate propio (~5-15 s por cambio) pero evita
# los directorios `incremental/`, que son los que más disco consumen.
[profile.fast]
inherits = "dev"
opt-level = 2
debug = false
incremental = false

# Tests y `cargo build` normal: sin incremental ni debug info para cuidar disco.
# Si necesitás backtraces con líneas, compilá con `cargo test --profile fast`.
[profile.dev]
incremental = false
debug = false

# Binario de uso normal: LTO thin, buen equilibrio compilación/runtime.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true

# Artefacto a distribuir: más lento de compilar, ~10% más chico.
[profile.dist]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
