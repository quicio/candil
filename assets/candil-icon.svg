  <!-- Lomo -->
  <path d="M500 682 C 512 690, 512 806, 500 814 L 524 814 C 512 806, 512 690, 524 682 Z"
        fill="#9C8E72"/>

  <!-- Filo de las páginas -->
  <path d="M188 816 C 322 768, 446 782, 500 814" fill="none" stroke="#C5BCA6" stroke-width="6"/>
  <path d="M836 816 C 702 768, 578 782, 524 814" fill="none" stroke="#C5BCA6" stroke-width="6"/>
</svg>
